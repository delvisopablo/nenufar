 <canvas id="c" style="display:block;width:100%;aspect-ratio:1/1;cursor:crosshair"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const W = 600, H = 600;
canvas.width = W; canvas.height = H;

const res = 4;
const rows = Math.floor(H / res);
const cols = Math.floor(W / res);
const field = new Float32Array(rows * cols);

const blues = [
  '#0a1628','#0d2137','#0e3a5e','#1a5276','#1f618d',
  '#2980b9','#5dade2','#85c1e9','#aed6f1'
];

// Fuentes base (siempre activas, sutiles)
const baseSources = [];
const ring = 8;
for (let i = 0; i < ring; i++) {
  const angle = (i / ring) * Math.PI * 2;
  baseSources.push({
    x: W/2 + Math.cos(angle) * 160,
    y: H/2 + Math.sin(angle) * 160,
    wl: 40 + (i % 4) * 10,
    phase: angle,
    amp: 0.25,
    born: -Infinity,
    life: Infinity
  });
}

// Clicks generan olas temporales
const clickSources = [];

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;

  // Varias sub-fuentes por click para efecto de piedra en agua
  for (let k = 0; k < 3; k++) {
    clickSources.push({
      x: cx,
      y: cy,
      wl: 20 + k * 14,
      phase: k * 1.1,
      amp: 1.4 - k * 0.3,
      born: time,
      life: 6.0 + k * 0.5
    });
  }
});

const levels = [-1.4, -0.8, -0.3, 0, 0.3, 0.8, 1.4];

let time = 0;

function animate() {
  ctx.fillStyle = '#0a1f3d';
  ctx.fillRect(0, 0, W, H);

  const now = time;
  const allSources = baseSources.concat(
    clickSources.filter(s => now - s.born < s.life)
  );
  // Limpiar viejas
  while (clickSources.length && now - clickSources[0].born >= clickSources[0].life) {
    clickSources.shift();
  }

  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < cols; j++) {
      const x = j * res, y = i * res;
      let amp = 0;

      for (let s = 0; s < allSources.length; s++) {
        const src = allSources[s];
        const age = now - src.born;
        if (age < 0) continue;

        // Fuentes base: oscilan levemente
        const sx = src.born === -Infinity
          ? src.x + Math.sin(now * 0.4 + src.phase) * 10
          : src.x;
        const sy = src.born === -Infinity
          ? src.y + Math.cos(now * 0.3 + src.phase) * 10
          : src.y;

        const dx = x - sx, dy = y - sy;
        const dist = Math.sqrt(dx * dx + dy * dy);

        let falloff;
        if (src.born === -Infinity) {
          falloff = Math.max(0, 1 - dist / 320);
        } else {
          // Ola de click: se expande y se desvanece
          const wavefront = age * 60;
          const spread = 80 + age * 20;
          const envelope = Math.max(0, 1 - Math.abs(dist - wavefront) / spread);
          const decay = Math.max(0, 1 - age / src.life);
          falloff = envelope * decay * Math.max(0, 1 - dist / 500);
        }

        amp += src.amp * falloff *
          Math.sin((dist / src.wl - now * 0.9) * 2 * Math.PI + src.phase);
      }

      field[i * cols + j] = amp;
    }
  }

  for (let li = 0; li < levels.length; li++) {
    const level = levels[li];
    ctx.strokeStyle = blues[li];
    ctx.lineWidth = li === 3 ? 1.2 : 0.7;
    ctx.globalAlpha = 0.75 + (li / levels.length) * 0.25;
    ctx.beginPath();

    for (let i = 0; i < rows - 1; i++) {
      for (let j = 0; j < cols - 1; j++) {
        const idx = i * cols + j;
        const x = j * res, y = i * res;
        const v00 = field[idx] > level;
        const v10 = field[idx + 1] > level;
        const v11 = field[idx + cols + 1] > level;
        const v01 = field[idx + cols] > level;

        if (v00 !== v10) { ctx.moveTo(x + res/2, y); ctx.lineTo(x + res, y + res/2); }
        if (v10 !== v11) { ctx.moveTo(x + res, y + res/2); ctx.lineTo(x + res/2, y + res); }
        if (v11 !== v01) { ctx.moveTo(x + res/2, y + res); ctx.lineTo(x, y + res/2); }
        if (v01 !== v00) { ctx.moveTo(x, y + res/2); ctx.lineTo(x + res/2, y); }
      }
    }
    ctx.stroke();
  }

  ctx.globalAlpha = 1;
  time += 0.012;
  requestAnimationFrame(animate);
}

animate();
</script>
