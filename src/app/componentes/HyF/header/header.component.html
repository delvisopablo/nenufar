<header class="header">
  <div class="brand-cluster">
    <button type="button" class="flower-button" (click)="irAEstanque()" aria-label="Ir al estanque de Nenufar">
      <img
        class="brand-flower"
        [src]="flowerSrc"
        alt="Flor Nenufar"
        width="56"
        height="56"
      >
    </button>

    <button type="button" class="brand-button" (click)="irAInicio()" aria-label="Ir al inicio de Nenufar">
      <img
        class="brand-logo"
        [src]="logoSrc"
        alt="Logo Nenufar"
        width="150"
        height="150"
      >
    </button>
  </div>

  <div class="header-actions">
    <div class="topbar-actions">
      <button type="button" class="top-action top-action--info" (click)="abrirNenunInfo()">Nenuninfo</button>
      @if (usuarioActual()?.id) {
        <button type="button" class="top-action top-action--profile" (click)="irAPerfilPrivado()">
          {{ getPerfilPrivadoLabel() }}
        </button>
      }

      <div class="search-shell">
        <form class="searchbar" (ngSubmit)="buscarPrimerNegocio()">
          <label class="searchbar-field" for="header-business-search">
            <input
              id="header-business-search"
              type="search"
              name="headerBusinessSearch"
              [formControl]="searchControl"
              placeholder="Buscar por nombre, nickname, categoria o ciudad"
              autocomplete="off"
            >
          </label>

          <button type="submit" class="search-btn">Buscar</button>
        </form>

        @if (resultadosBusqueda().length) {
          <div class="search-results" role="list">
            @for (negocio of resultadosBusqueda(); track negocio.id) {
              <article class="search-result">
                <button type="button" class="search-result__main" (click)="seleccionarNegocio(negocio)">
                  <span class="search-result__media">
                    <img
                      [src]="getNenufarNegocio(negocio)"
                      [alt]="negocio.nombre"
                      width="48"
                      height="48"
                    >
                  </span>
                  <span class="search-result__copy">
                    <strong>
                      {{ negocio.nombre }}
                      @if (negocio.verificado) {
                        <span class="search-result__verified">✓</span>
                      }
                    </strong>
                    <span>{{ getSearchMeta(negocio) }}</span>
                    <span class="search-result__reviews">{{ getReviewSummary(negocio) }}</span>
                  </span>
                </button>

                <button
                  type="button"
                  class="follow-chip"
                  [class.follow-chip--active]="negocio.isFollowing"
                  (click)="toggleSeguir($event, negocio)"
                >
                  {{ negocio.isFollowing ? 'Siguiendo' : 'Seguir' }}
                </button>
              </article>
            }
          </div>
        } @else if (busquedaEstado() === 'loading') {
          <div class="search-empty">Buscando negocios...</div>
        } @else if (sinResultadosBusqueda()) {
          <div class="search-empty">Sin resultados.</div>
        }
      </div>
    </div>
  </div>
</header>

<app-nenun-info
  [open]="nenunInfoAbierto()"
  (closed)="cerrarNenunInfo()"
/>

<app-access-required-modal
  [open]="accessModalAbierto()"
  [message]="accessModalMessage()"
  (closed)="accessModalAbierto.set(false)"
  (loginRequested)="irALogin()"
/>
