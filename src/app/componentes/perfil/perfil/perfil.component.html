<section class="perfil-bridge">
  <div class="perfil-bridge__card">
    <p class="perfil-bridge__kicker">Mi perfil</p>
    <h1>Preparando tu espacio</h1>

    @if (cargando()) {
      <p>Estamos comprobando si debemos llevarte a tu perfil de usuario o al perfil de tu negocio.</p>
    } @else if (error()) {
      <p>{{ error() }}</p>
      <a routerLink="/inicio" class="perfil-bridge__link">Volver a inicio</a>
    } @else {
      <p>Redirigiendo...</p>
    }
  </div>
</section>
