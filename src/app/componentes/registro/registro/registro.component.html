<form [formGroup]="registroForm" (ngSubmit)="registrarUsuario()" class="formulario-nenu">
  <h2>Crear Cuenta</h2>

  <input type="text" formControlName="nombre" autocomplete="name" placeholder="Nombre">
<input type="text" formControlName="nickname" placeholder="Nombre de usuario">

  <input type="email" formControlName="email" placeholder="Correo electrónico" />
  <input type="password" formControlName="password"  />
  <input type="password" formControlName="confirmarContrasena" placeholder="Confirmar contraseña"  />

  <textarea formControlName="biografia" placeholder="Cuenta algo sobre ti "></textarea>
