<section class="pond-background">
  <app-estanque-background class="pond-canvas"></app-estanque-background>

  <div class="page-shell">
    <article class="auth-card">
      <p class="eyebrow">Cuenta personal</p>
      <h1>Nénúfate como usuario</h1>
      <p class="auth-copy">
        Crea tu cuenta para guardar reseñas, reservar con más calma y moverte por Nenúfar con tu
        propio ritmo.
      </p>

      <div class="intro-links">
        <button type="button" class="text-link" (click)="volverAOpciones()">
          Elegir otro tipo de cuenta
        </button>
        <button type="button" class="text-link" (click)="irAlEstanque()">
          Volver al acceso
        </button>
      </div>

      <div class="section-head">
        <h2>Tus datos</h2>
        <p>Solo te pedimos lo necesario para empezar a moverte por el estanque.</p>
      </div>

      <form [formGroup]="registroForm" (ngSubmit)="registrarUsuario()" class="auth-form" novalidate>
        <div class="field-grid">
          <label class="field">
            <span>Nombre</span>
            <input
              type="text"
              formControlName="nombre"
              autocomplete="name"
              placeholder="Cómo te llamas"
            >
            @if (campoInvalido('nombre')) {
              <small class="field-error">{{ getErrorCampo('nombre') }}</small>
            }
          </label>

          <label class="field">
            <span>Nombre de usuario</span>
            <input
              type="text"
              formControlName="nickname"
              autocomplete="username"
              placeholder="Tu nombre dentro de Nenúfar"
            >
            @if (campoInvalido('nickname')) {
              <small class="field-error">{{ getErrorCampo('nickname') }}</small>
            }
          </label>
        </div>

        <label class="field">
          <span>Correo electrónico</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="nombre@correo.com"
          >
          @if (campoInvalido('email')) {
            <small class="field-error">{{ getErrorCampo('email') }}</small>
          }
        </label>

        <div class="field-grid">
          <label class="field">
            <span>Contraseña</span>
            <input
              type="password"
              formControlName="password"
              autocomplete="new-password"
              placeholder="Mínimo 6 caracteres"
            >
            @if (campoInvalido('password')) {
              <small class="field-error">{{ getErrorCampo('password') }}</small>
            }
          </label>

          <label class="field">
            <span>Repite la contraseña</span>
            <input
              type="password"
              formControlName="confirmarContrasena"
              autocomplete="new-password"
              placeholder="Escríbela de nuevo"
            >
            @if (campoInvalido('confirmarContrasena') || registroForm.hasError('passwordMismatch')) {
              <small class="field-error">{{ getErrorCampo('confirmarContrasena') }}</small>
            }
          </label>
        </div>

        <label class="field">
          <div class="field-topline">
            <span>Biografía breve</span>
            <small>{{ biografiaRestante }} caracteres disponibles</small>
          </div>
          <textarea
            formControlName="biografia"
            rows="4"
            maxlength="220"
            placeholder="Cuéntanos un poco de ti, si te apetece."
          ></textarea>
          @if (campoInvalido('biografia')) {
            <small class="field-error">{{ getErrorCampo('biografia') }}</small>
          }
        </label>

        @if (errorMensaje()) {
          <div class="form-feedback" role="alert">
            {{ errorMensaje() }}
          </div>
        }

        <div class="form-actions">
          <button type="submit" class="primary-btn" [disabled]="registrando()">
            {{ registrando() ? 'Nénúfandote...' : 'Nénúfate' }}
          </button>

          <button type="button" class="secondary-btn" (click)="irARegistroNegocio()">
            Prefiero registrar un negocio
          </button>
        </div>
      </form>
    </article>
  </div>
</section>
