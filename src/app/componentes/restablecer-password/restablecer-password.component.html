<section class="pond-background">
  <app-estanque-background class="pond-canvas"></app-estanque-background>

  <div class="page-shell">
    <article class="auth-card">
      <p class="eyebrow">Acceso</p>
      <h1>Restablecer contraseña</h1>

      @if (!tokenValido()) {
        <p class="form-feedback form-feedback--error" role="alert">
          El enlace no es válido o está incompleto.
        </p>

        <button type="button" class="text-link" (click)="solicitarNuevoEnlace()">
          Solicitar nuevo enlace
        </button>
      } @else if (exitoMensaje()) {
        <p class="form-feedback form-feedback--success" role="status">{{ exitoMensaje() }}</p>

        <div class="form-actions">
          <button type="button" class="primary-btn" (click)="irAlLogin()">
            Ir al login
          </button>
        </div>
      } @else {
        <p class="auth-copy">
          Escribe tu nueva contraseña para completar el cambio.
        </p>

        <form [formGroup]="form" (ngSubmit)="cambiarPassword()" class="auth-form" novalidate>
          <label class="field">
            <span>Nueva contraseña<span class="required-mark" aria-hidden="true">*</span></span>
            <input
              type="password"
              formControlName="nuevaPassword"
              autocomplete="new-password"
              placeholder="Mínimo 8 caracteres"
            >
            <ul class="password-checklist">
              <li [class.is-met]="getPasswordRequirements().minLength">Mínimo 8 caracteres</li>
              <li [class.is-met]="getPasswordRequirements().mayuscula">Una mayúscula</li>
              <li [class.is-met]="getPasswordRequirements().minuscula">Una minúscula</li>
              <li [class.is-met]="getPasswordRequirements().numero">Un número</li>
            </ul>
            @if (campoInvalido('nuevaPassword')) {
              <small class="field-error">{{ getErrorCampo('nuevaPassword') }}</small>
            }
          </label>

          <label class="field">
            <span>Repite la nueva contraseña<span class="required-mark" aria-hidden="true">*</span></span>
            <input
              type="password"
              formControlName="confirmarPassword"
              autocomplete="new-password"
              placeholder="Escríbela de nuevo"
            >
            @if (campoInvalido('confirmarPassword') || form.hasError('passwordMismatch')) {
              <small class="field-error">{{ getErrorCampo('confirmarPassword') }}</small>
            }
          </label>

          @if (errorMensaje()) {
            <p class="form-feedback form-feedback--error" role="alert">{{ errorMensaje() }}</p>
          }

          @if (enlaceCaducado()) {
            <button type="button" class="text-link" (click)="solicitarNuevoEnlace()">
              Solicitar nuevo enlace
            </button>
          }

          <div class="form-actions">
            <button type="submit" class="primary-btn" [disabled]="enviando()">
              {{ enviando() ? 'Cambiando...' : 'Cambiar contraseña' }}
            </button>
          </div>
        </form>
      }
    </article>
  </div>
</section>
