<section class="pond-background">
  <app-estanque-background class="pond-canvas"></app-estanque-background>

  <div class="page-shell">
    <article class="auth-card">
      <p class="eyebrow">Acceso</p>
      <h1>Recuperar contraseña</h1>
      <p class="auth-copy">
        Introduce tu correo y te enviaremos un enlace para cambiar tu contraseña.
      </p>

      @if (!exitoMensaje()) {
        <form [formGroup]="form" (ngSubmit)="enviarEnlace()" class="auth-form" novalidate>
          <label class="field" for="email">
            <span>Correo electrónico<span class="required-mark" aria-hidden="true">*</span></span>
            <input
              id="email"
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="nombre@correo.com"
            >
            @if (campoInvalido('email')) {
              <small class="field-error">{{ getErrorCampo('email') }}</small>
            }
          </label>

          @if (errorMensaje()) {
            <p class="form-feedback form-feedback--error" role="alert">{{ errorMensaje() }}</p>
          }

          <div class="form-actions">
            <button type="submit" class="primary-btn" [disabled]="enviando()">
              {{ enviando() ? 'Enviando...' : 'Enviarme enlace' }}
            </button>
          </div>
        </form>
      } @else {
        <p class="form-feedback form-feedback--success" role="status">{{ exitoMensaje() }}</p>
      }

      <button type="button" class="text-link" (click)="volverAlLogin()">
        Volver a iniciar sesión
      </button>
    </article>
  </div>
</section>
