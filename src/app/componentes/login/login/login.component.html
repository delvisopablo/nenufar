<section class="pond-background">
  <app-estanque-background class="pond-canvas"></app-estanque-background>

  <div class="page-shell">
    <article class="auth-card">
      <p class="eyebrow">Acceso</p>
      <h1>Nénúfate</h1>
      <p class="auth-copy">
        Inicia sesión y guarda tu actividad, o date una vuelta en tu nenúfar.
      </p>

      <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="iniciarSesion()" novalidate>
        <label class="field" for="email">
          <span>Correo electrónico</span>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="nombre@correo.com"
          >
          @if (campoInvalido('email')) {
            <small class="field-error">{{ getErrorCampo('email') }}</small>
          }
        </label>

        <label class="field" for="password">
          <span>Contraseña</span>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Tu contraseña"
          >
          @if (campoInvalido('password')) {
            <small class="field-error">{{ getErrorCampo('password') }}</small>
          }
        </label>

        <label class="remember-row" for="rememberMe">
          <input
            id="rememberMe"
            type="checkbox"
            formControlName="rememberMe"
          >
          <span class="remember-box" aria-hidden="true"></span>
          <span>Recuérdame</span>
        </label>

        @if (loginError()) {
          <p class="form-feedback" role="alert">{{ loginError() }}</p>
        }

        <button type="submit" class="primary-btn" [disabled]="loginForm.invalid || loginSubmitting()">
          {{ loginSubmitting() ? 'Iniciando...' : 'Iniciar sesión' }}
        </button>
      </form>

      <div class="login-actions">
        <button type="button" class="secondary-btn" (click)="continuarComoInvitado()">
          Continuar como invitado
        </button>
        <button type="button" class="text-link" (click)="crearCuenta()">
          Si no tienes cuenta
        </button>
      </div>
    </article>
  </div>
</section>
