<div class="login-container">
  <div class="login-box">
    <h2 class="text-xl">Iniciar sesión</h2>

    <form (ngSubmit)="iniciarSesion()" [formGroup]="loginForm">
      <label for="usuario">Usuario</label>
      <input id="usuario" type="text" formControlName="usuario" placeholder="Introduce tu usuario" />

      <label for="contrasena">Contraseña</label>
      <input type="password" formControlName="contrasena" placeholder="Contraseña" autocomplete="new-password" />

      @if (loginError()) {
        <p class="error">Usuario o contraseña incorrectos</p>
      }

      <button type="submit" [disabled]="loginForm.invalid">Entrar</button>
    </form>

    <div class="acciones">
      <button type="button" (click)="crearCuenta()">Crear cuenta</button>
      <button type="button" (click)="recuperarClave()">He olvidado la contraseña</button>
    </div>
  </div>
</div>
