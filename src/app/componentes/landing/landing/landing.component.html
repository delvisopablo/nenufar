<app-header></app-header>

<div class="main">

  <div class="countdown-title">¡¡Cuenta atrás para el lanzamiento!!</div>

  <div class="countdown">
    @for (item of countdownArray; track $index) {
      <div class="count-box">
        <strong>{{ item.value }}</strong><br>
        {{ item.label }}
      </div>
    }
  </div>

  <div class="survey-box">
    <span>Una breve encuesta para recoger datos para mi TFG 😁</span><br>
    <button (click)="formulario()" class="survey-button">Encuesta 📝</button>
  </div>
