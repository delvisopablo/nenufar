<div class="pond-wrapper">
  <header class="pond-header">
    <h1>nenúfar</h1>
    <p>para que tu negocio no se estanque</p>
  </header>

  <canvas #pond class="pond-canvas" (click)="onCanvasClick($event)"></canvas>

  @if (modalOpen()) {
    <div class="modal-bg" (click)="closeModal()">
      <div class="modal" (click)="$event.stopPropagation()">
        <button type="button" class="close-btn" (click)="closeModal()" aria-label="Cerrar">
          ✕
        </button>

        <h2>nenúfar</h2>
        <p class="subtitle">accede a tu cuenta</p>

        <input
          type="email"
          placeholder="correo electrónico"
          [(ngModel)]="email"
          autocomplete="email"
        >
        <input
          type="password"
          placeholder="contraseña"
          [(ngModel)]="password"
          autocomplete="current-password"
        >

        @if (loginError()) {
          <p class="feedback">{{ loginError() }}</p>
        }

        <button type="button" class="btn-enter" (click)="onLogin()" [disabled]="loginPending()">
          {{ loginPending() ? 'entrando...' : 'entrar' }}
        </button>
        <button type="button" class="btn-register" (click)="onRegister()" [disabled]="loginPending()">
           Crear cuenta
        </button>
      </div>
    </div>
  }
</div>
