<section class="selector-shell" aria-label="Selector de nenufar">
  @if (title) {
    <div class="selector-head">
      <h3>{{ title }}</h3>
    </div>
  }

  <div class="carousel" role="group" aria-label="Carrusel de nenufares">
    <button
      type="button"
      class="carousel-arrow"
      (click)="goPrev()"
      [disabled]="!canGoPrev"
      [attr.aria-label]="'Anterior nenufar'"
    >
      ‹
    </button>

    <div
      #carouselTrack
      class="carousel-track"
      (scroll)="onTrackScroll()"
      aria-label="Lista horizontal de nenufares"
    >
      @for (option of options; track option.id; let i = $index) {
        <button
          #optionCard
          type="button"
          class="nenu-card"
          [class.nenu-card--focused]="isFocused(i)"
          [class.nenu-card--selected]="isSelected(option)"
          [attr.aria-current]="isFocused(i) ? 'true' : null"
          [attr.aria-pressed]="isSelected(option)"
          [attr.aria-label]="'Seleccionar ' + formatOptionLabel(option.label)"
          (click)="selectOption(option)"
        >
          <span class="nenu-media">
            <img [src]="option.asset" [alt]="formatOptionLabel(option.label)" />
          </span>
          <strong class="nenu-label">{{ formatOptionLabel(option.label) }}</strong>
        </button>
      }
    </div>

    <button
      type="button"
      class="carousel-arrow"
      (click)="goNext()"
      [disabled]="!canGoNext"
      [attr.aria-label]="'Siguiente nenufar'"
    >
      ›
    </button>
  </div>

  @if (selectedOption) {
    <p class="selector-choice">{{ formatOptionLabel(selectedOption.label) }}</p>
  } @else {
    <p class="selector-choice selector-choice--muted">Elige tu nenúfar</p>
  }
</section>
